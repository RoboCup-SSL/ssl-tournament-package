name: CI

# Gate every PR into main, and build again after each merge to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Cross-compile the full release matrix as a build check (no publish).
      # Static binaries (CGO disabled) with the web UI embedded via //go:embed.
      - name: Cross-compile all targets
        run: make release VERSION=ci-${{ github.sha }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ssl-tournament-binaries
          path: release/
          retention-days: 7
